plugins { id 'com.android.application' }

android {
    namespace 'com.kittyai.assistant'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kittyai.assistant'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }
}

dependencies {
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
